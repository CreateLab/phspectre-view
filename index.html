<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>PhSpectre</title>
<style>
  :root {
    --bg: #111111;
    --card: #1b1b1b;
    --line: #2b2b2b;
    --text: #ececec;
    --muted: #8d8d8d;
    --accent: #e8b04a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 520px; }
  .photo { display: block; width: 100%; border-radius: 10px; margin-bottom: 16px; background: var(--card); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 1.15rem; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--muted); font-size: .9rem; }
  .exposure { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .exposure div { text-align: center; }
  .exposure b { display: block; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .exposure span, .label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .sim {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: var(--accent); color: #1a1200; font-weight: 700; font-size: .95rem;
  }
  .title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .dl { padding: 5px 10px; font-size: .78rem; color: var(--muted); }
  .dl:hover { color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .row:nth-last-child(-n+2) { border-bottom: 0; }
  .row .k { color: var(--muted); }
  .row .v { font-variant-numeric: tabular-nums; text-align: right; }
  .note { margin-top: 12px; color: var(--muted); font-size: .9rem; white-space: pre-wrap; }
  .empty p { color: var(--muted); margin: 8px 0 16px; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .err { color: #e07a7a; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 20px; }
  footer a { color: inherit; }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } .row:nth-last-child(2) { border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main id="app"></main>

<script>
/*
 * PhSpectre viewer — bit-packed binary payload format.
 *
 * URL: #b.<base64url>
 *   'b' = this format (only one for now; bump the letter if it ever changes
 *   incompatibly — old links then just show "couldn't read this link").
 *
 * Byte layout (all multi-bit fields inside the two packed blocks are
 * MSB-first: the first field listed occupies the highest bits). Everything
 * outside those two blocks is plain byte-aligned.
 *
 *   byte 0        flags
 *                   bit0 hasRecipe
 *                   bit1 hasPhoto
 *                   bit2 hasNote
 *                   bit3-7 reserved, must be 0
 *   1 byte + N     camera: length-prefixed UTF-8 (length 0 = unknown).
 *                   Strip any "FUJIFILM " brand prefix before encoding —
 *                   implied whenever a recipe block is present.
 *   1 byte + N     lens: length-prefixed UTF-8 (length 0 = unknown)
 *   5 bytes        EXPOSURE block, 34 packed bits + 6 zero padding bits:
 *                     focal_mm        10 bit, unsigned, raw value, 0 = unknown
 *                     aperture_x10     8 bit, unsigned, f-number*10, 0 = unknown
 *                     shutter_code     8 bit, unsigned, 255 = unknown, else
 *                                      tv3 = code - 64, seconds = 2^(-tv3/3)
 *                     iso_code         8 bit, unsigned, 255 = unknown, else
 *                                      stops3 = code - 64, ISO = 100 * 2^(stops3/3)
 *   8 bytes        RECIPE block (only if hasRecipe), 62 packed bits + 2 zero
 *                  padding bits. All "value = raw - offset" fields are given
 *                  as raw ranges below:
 *                     film_sim         5 bit  0..19        → SIMS
 *                     white_balance    4 bit  0..11        → WB
 *                     kelvin_enc      10 bit  0 = unset, else K = (raw-1)*10+2500
 *                     wb_shift_r       5 bit  raw-9  (raw 0..18 → -9..9)
 *                     wb_shift_b       5 bit  raw-9
 *                     dynamic_range    2 bit  0..3         → DR
 *                     highlight        4 bit  raw-8  (half-stops)
 *                     shadow           4 bit  raw-8  (half-stops)
 *                     color            4 bit  raw-8
 *                     sharpness        4 bit  raw-8
 *                     noise_reduction  4 bit  raw-8
 *                     clarity          4 bit  raw-8
 *                     grain            3 bit  0..4         → GRAIN
 *                     color_chrome     2 bit  0..2         → CHROME
 *                     cc_blue          2 bit  0..2         → CHROME
 *   1 byte + N     photo (only if hasPhoto): length-prefixed UTF-8 — full
 *                  https:// URL, or an id resolved via PHOTO_BASE below
 *   1 byte + N     note (only if hasNote): length-prefixed UTF-8, free text
 *
 * No date field — intentionally dropped.
 * No JSON, no compression: the packing already does that job.
 */
const PHOTO_BASE = ""; // e.g. "https://photos.example.com/p/" — used when the photo field is a bare id, ".jpg" is appended

const SIMS = ["Provia / Standard","Velvia / Vivid","Astia / Soft","Classic Chrome","Pro Neg. Hi","Pro Neg. Std","Classic Neg.",
  "Eterna / Cinema","Eterna Bleach Bypass","Nostalgic Neg.","Reala Ace","Acros","Acros + Ye","Acros + R","Acros + G",
  "Monochrome","Monochrome + Ye","Monochrome + R","Monochrome + G","Sepia"];
const WB = ["Auto","Auto (white priority)","Auto (ambient priority)","Daylight","Shade","Fluorescent 1","Fluorescent 2",
  "Fluorescent 3","Incandescent","Underwater","Kelvin","Custom"];
const DR = ["Auto","DR100","DR200","DR400"];
const GRAIN = ["Off","Weak · Small","Strong · Small","Weak · Large","Strong · Large"];
const CHROME = ["Off","Weak","Strong"];

const app = document.getElementById("app");

/* ---------- small helpers ---------- */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const has = v => v !== null && v !== undefined && v !== "";
const signed = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";
const half = n => signed(n / 2);
const pick = (arr, i) => arr[i] ?? "—";

function fmtShutter(s) {
  if (!has(s)) return "—";
  if (s >= 1) return (Math.round(s * 10) / 10) + "s";
  return "1/" + Math.round(1 / s);
}

/* ---------- base64url ---------- */
function fromB64url(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function toB64url(bytes) {
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

/* ---------- bit-level read/write over a fixed-size byte slice ---------- */
function bytesToBigInt(bytes) {
  let v = 0n;
  for (const b of bytes) v = (v << 8n) | BigInt(b);
  return v;
}
function bitReader(bytes) {
  const value = bytesToBigInt(bytes);
  let remaining = BigInt(bytes.length * 8);
  return {
    read(width) {
      const w = BigInt(width);
      remaining -= w;
      return Number((value >> remaining) & ((1n << w) - 1n));
    },
  };
}
function bitWriter(totalBits) {
  let acc = 0n, used = 0n;
  return {
    write(value, width) {
      const w = BigInt(width);
      acc = (acc << w) | (BigInt(value) & ((1n << w) - 1n));
      used += w;
    },
    toBytes(byteLen) {
      let v = acc << (BigInt(totalBits) - used); // right-pad with zero bits
      const out = new Uint8Array(byteLen);
      for (let i = byteLen - 1; i >= 0; i--) { out[i] = Number(v & 0xFFn); v >>= 8n; }
      return out;
    },
  };
}

/* ---------- string (length-prefixed) read/write ---------- */
function readStr(bytes, pos) {
  const len = bytes[pos.i++];
  if (!len) return null;
  const s = new TextDecoder().decode(bytes.subarray(pos.i, pos.i + len));
  pos.i += len;
  return s;
}
function writeStr(parts, s) {
  const bytes = s ? new TextEncoder().encode(s) : new Uint8Array(0);
  if (bytes.length > 255) throw new Error("string too long (max 255 bytes): " + s);
  parts.push(new Uint8Array([bytes.length]), bytes);
}

/* ---------- payload codec ---------- */
function decode(hash) {
  const m = /^#?b\.([A-Za-z0-9_-]+)$/.exec(hash);
  if (!m) return null;
  const bytes = fromB64url(m[1]);
  const pos = { i: 0 };

  const flags = bytes[pos.i++];
  const hasRecipe = !!(flags & 1), hasPhoto = !!(flags & 2), hasNote = !!(flags & 4);

  const camera = readStr(bytes, pos);
  const lens = readStr(bytes, pos);

  const er = bitReader(bytes.subarray(pos.i, pos.i + 5)); pos.i += 5;
  const focalRaw = er.read(10);
  const apertureRaw = er.read(8);
  const shutterRaw = er.read(8);
  const isoRaw = er.read(8);

  let recipe = null;
  if (hasRecipe) {
    const rr = bitReader(bytes.subarray(pos.i, pos.i + 8)); pos.i += 8;
    recipe = {
      sim: rr.read(5),
      wb: rr.read(4),
      kelvinEnc: rr.read(10),
      wbShiftR: rr.read(5) - 9,
      wbShiftB: rr.read(5) - 9,
      dr: rr.read(2),
      highlight: rr.read(4) - 8,
      shadow: rr.read(4) - 8,
      color: rr.read(4) - 8,
      sharpness: rr.read(4) - 8,
      noiseReduction: rr.read(4) - 8,
      clarity: rr.read(4) - 8,
      grain: rr.read(3),
      colorChrome: rr.read(2),
      ccBlue: rr.read(2),
    };
  }

  const photo = hasPhoto ? readStr(bytes, pos) : null;
  const note = hasNote ? readStr(bytes, pos) : null;

  return {
    camera, lens,
    focal: focalRaw || null,
    aperture: apertureRaw ? apertureRaw / 10 : null,
    shutter: shutterRaw === 255 ? null : Math.pow(2, -(shutterRaw - 64) / 3),
    iso: isoRaw === 255 ? null : Math.round(100 * Math.pow(2, (isoRaw - 64) / 3)),
    recipe, photo, note,
  };
}

// Debug/demo encoder — mirrors the future C# writer, kept here only so this
// page can produce a test link without it. `f` matches the shape `decode()`
// returns, plus raw (unrounded) exposure numbers.
function encode(f) {
  const hasRecipe = !!f.recipe, hasPhoto = has(f.photo), hasNote = has(f.note);
  const flags = (hasRecipe ? 1 : 0) | (hasPhoto ? 2 : 0) | (hasNote ? 4 : 0);

  const parts = [new Uint8Array([flags])];
  writeStr(parts, f.camera);
  writeStr(parts, f.lens);

  const ew = bitWriter(40);
  ew.write(f.focal || 0, 10);
  ew.write(f.aperture ? Math.round(f.aperture * 10) : 0, 8);
  ew.write(has(f.shutter) ? clampByte(Math.round(Math.log2(1 / f.shutter) * 3) + 64) : 255, 8);
  ew.write(has(f.iso) ? clampByte(Math.round(3 * Math.log2(f.iso / 100)) + 64) : 255, 8);
  parts.push(ew.toBytes(5));

  if (hasRecipe) {
    const r = f.recipe;
    const rw = bitWriter(64);
    rw.write(r.sim ?? 0, 5);
    rw.write(r.wb ?? 0, 4);
    rw.write(r.kelvin ? Math.round((r.kelvin - 2500) / 10) + 1 : 0, 10);
    rw.write((r.wbShiftR ?? 0) + 9, 5);
    rw.write((r.wbShiftB ?? 0) + 9, 5);
    rw.write(r.dr ?? 0, 2);
    rw.write((r.highlight ?? 0) + 8, 4);
    rw.write((r.shadow ?? 0) + 8, 4);
    rw.write((r.color ?? 0) + 8, 4);
    rw.write((r.sharpness ?? 0) + 8, 4);
    rw.write((r.noiseReduction ?? 0) + 8, 4);
    rw.write((r.clarity ?? 0) + 8, 4);
    rw.write(r.grain ?? 0, 3);
    rw.write(r.colorChrome ?? 0, 2);
    rw.write(r.ccBlue ?? 0, 2);
    parts.push(rw.toBytes(8));
  }
  if (hasPhoto) writeStr(parts, f.photo);
  if (hasNote) writeStr(parts, f.note);

  let total = 0; for (const p of parts) total += p.length;
  const out = new Uint8Array(total);
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return "#b." + toB64url(out);
}
function clampByte(n) { return Math.max(0, Math.min(254, n)); }

/* ---------- render ---------- */
function photoUrl(v) {
  if (!has(v)) return null;
  if (/^https:\/\//i.test(v)) return v;
  if (PHOTO_BASE && /^[A-Za-z0-9_-]+$/.test(v)) return PHOTO_BASE + v + ".jpg";
  return null;
}

function slug(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "phspectre";
}

function recipeToJson(d) {
  const r = d.recipe;
  const out = {};
  if (has(d.camera)) out.camera = d.camera;
  if (has(d.lens)) out.lens = d.lens;
  if (has(d.focal)) out.focalLengthMm = d.focal;
  if (has(d.aperture)) out.aperture = "f/" + d.aperture;
  if (has(d.shutter)) out.shutterSpeed = fmtShutter(d.shutter);
  if (has(d.iso)) out.iso = d.iso;
  out.filmRecipe = {
    filmSimulation: pick(SIMS, r.sim),
    whiteBalance: r.wb === 10 && r.kelvinEnc ? ((r.kelvinEnc - 1) * 10 + 2500) + "K" : pick(WB, r.wb),
    wbShiftRed: r.wbShiftR,
    wbShiftBlue: r.wbShiftB,
    dynamicRange: pick(DR, r.dr),
    highlightTone: r.highlight / 2,
    shadowTone: r.shadow / 2,
    color: r.color,
    sharpness: r.sharpness,
    noiseReduction: r.noiseReduction,
    clarity: r.clarity,
    grainEffect: pick(GRAIN, r.grain),
    colorChromeEffect: pick(CHROME, r.colorChrome),
    colorChromeBlue: pick(CHROME, r.ccBlue),
  };
  if (has(d.note)) out.note = d.note;
  return out;
}

function downloadRecipeJson(d) {
  const blob = new Blob([JSON.stringify(recipeToJson(d), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a");
  a.href = url;
  a.download = slug(d.camera) + "-recipe.json";
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderRecipe(d) {
  const r = d.recipe;
  const card = el("section", "card");
  const title = el("div", "title");
  title.append(el("span", "sim", pick(SIMS, r.sim)));
  const right = el("span");
  right.append(el("span", "label", "Film recipe "));
  const dl = el("button", "dl", "Download JSON");
  dl.onclick = () => downloadRecipeJson(d);
  right.append(dl);
  title.append(right);
  card.append(title);

  const grid = el("div", "grid");
  const wbText = r.wb === 10 && r.kelvinEnc ? ((r.kelvinEnc - 1) * 10 + 2500) + "K" : pick(WB, r.wb);
  const rows = [
    ["White balance", wbText],
    ["WB shift", `R ${signed(r.wbShiftR)} · B ${signed(r.wbShiftB)}`],
    ["Dynamic range", pick(DR, r.dr)],
    ["Grain", pick(GRAIN, r.grain)],
    ["Highlight", half(r.highlight)],
    ["Shadow", half(r.shadow)],
    ["Color", signed(r.color)],
    ["Clarity", signed(r.clarity)],
    ["Sharpness", signed(r.sharpness)],
    ["Noise reduction", signed(r.noiseReduction)],
    ["Color Chrome", pick(CHROME, r.colorChrome)],
    ["CC Blue", pick(CHROME, r.ccBlue)],
  ];
  for (const [k, v] of rows) {
    const row = el("div", "row");
    row.append(el("span", "k", k), el("span", "v", v));
    grid.append(row);
  }
  card.append(grid);
  return card;
}

function render(d) {
  app.replaceChildren();

  const src = photoUrl(d.photo);
  if (src) {
    const img = el("img", "photo");
    img.src = src; img.alt = "Photo"; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.onerror = () => img.remove();
    app.append(img);
  }

  const hasExposure = has(d.focal) || has(d.aperture) || has(d.shutter) || has(d.iso);
  const hasHead = has(d.camera) || has(d.lens) || hasExposure || has(d.note);

  if (hasHead) {
    const head = el("section", "card");
    if (has(d.camera)) head.append(el("h1", null, d.camera));
    if (has(d.lens)) head.append(el("div", "sub", d.lens));

    if (hasExposure) {
      const exp = el("div", "exposure");
      const cell = (v, l) => { const c = el("div"); c.append(el("b", null, v), el("span", null, l)); return c; };
      exp.append(
        cell(has(d.focal) ? d.focal + " mm" : "—", "Focal"),
        cell(has(d.aperture) ? "f/" + d.aperture : "—", "Aperture"),
        cell(fmtShutter(d.shutter), "Shutter"),
        cell(has(d.iso) ? String(d.iso) : "—", "ISO"),
      );
      head.append(exp);
    }
    if (has(d.note)) head.append(el("div", "note", d.note));
    app.append(head);
  }

  if (d.recipe) app.append(renderRecipe(d));

  const f = el("footer");
  const a = el("a", null, "PhSpectre");
  a.href = "https://github.com/CreateLab/PhSpectre";
  f.append("Made with ", a);
  app.append(f);
}

function renderEmpty(error) {
  app.replaceChildren();
  const c = el("section", "card empty");
  c.append(el("h1", null, "PhSpectre"));
  if (error) c.append(el("p", "err", "Couldn't read this link: " + error));
  else c.append(el("p", null, "Scan the QR code on a PhSpectre frame to see the shot's details and film recipe here."));
  const b = el("button", null, "Show demo");
  b.onclick = () => { location.hash = encode(DEMO); };
  c.append(b);
  app.append(c);
}

const DEMO = {
  camera: "X-T5", lens: "XF 35mm F1.4 R",
  focal: 35, aperture: 1.4, shutter: 1 / 250, iso: 400,
  recipe: {
    sim: 3, wb: 3, kelvin: 0, wbShiftR: 2, wbShiftB: -5,
    dr: 2, highlight: 3, shadow: 3, color: -2, sharpness: -1,
    noiseReduction: -4, clarity: -2, grain: 1, colorChrome: 2, ccBlue: 1,
  },
  note: "Demo shot",
};

function boot() {
  try {
    const d = decode(location.hash);
    if (d) render(d); else renderEmpty();
  } catch (e) {
    renderEmpty(e.message);
  }
}
addEventListener("hashchange", boot);
boot();
</script>
</body>
</html>
